crowdsec:
  container_runtime: containerd
  lapi:
    enabled: false
  secrets:
    externalSecret:
      name: crowdsec-agent
      registrationTokenKey: registrationToken
  agent:
    lapiURL: http://10.0.0.1:8080
    lapiHost: 10.0.0.1
    lapiPort: 8080
    acquisition:
      - namespace: traefik
        podName: traefik-*
        program: traefik
    env:
      - name: COLLECTIONS
        value: crowdsecurity/traefik
    resources:
      requests:
        cpu: 50m
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
  appsec:
    enabled: true
    lapiURL: http://10.0.0.1:8080
    lapiHost: 10.0.0.1
    lapiPort: 8080
    acquisitions:
      - source: appsec
        listen_addr: "0.0.0.0:7422"
        path: /
        appsec_configs:
          - crowdsecurity/appsec-default
        labels:
          type: appsec
    env:
      - name: COLLECTIONS
        value: crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules
    resources:
      requests:
        cpu: 50m
        memory: 250Mi
      limits:
        memory: 250Mi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
