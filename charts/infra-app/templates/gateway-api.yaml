apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  # no resources-finalizer: deleting this app must not cascade-delete the CRDs and every route
spec:
  project: infra
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    path: config/crd
    targetRevision: v1.6.3
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
