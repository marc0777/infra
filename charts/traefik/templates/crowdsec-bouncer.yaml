apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: crowdsec-bouncer
spec:
  plugin:
    crowdsec-bouncer:
      enabled: true
      crowdsecMode: appsec
      crowdsecLapiKey: urn:k8s:secret:crowdsec-bouncer:key
      crowdsecAppsecEnabled: true
      crowdsecAppsecHost: crowdsec-appsec-service.crowdsec.svc:7422
      crowdsecAppsecUnreachableBlock: false
      crowdsecAppsecFailureBlock: false
