traefik:
  providers:
    kubernetesGateway:
      enabled: true
  gateway:
    listeners:
      websecure:
        port: 8443
        protocol: HTTPS
        namespacePolicy:
          from: All
        certificateRefs:
        - name: fincato-pnogo-wildcard-tls
  deployment:
    kind: DaemonSet
    # Resolve cluster DNS names (e.g. CrowdSec services) while on the host network
    dnsPolicy: ClusterFirstWithHostNet
  # Listen on the nodes' IPv6 addresses for IPv6 ingress forwarded by OPNsense
  hostNetwork: true
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  accessLog:
    enabled: true
  metrics:
    prometheus:
      serviceMonitor:
        enabled: true
  global:
    checkNewVersion: false
    sendAnonymousUsage: false
  additionalArguments:
  - --serverstransport.insecureskipverify=true
  tlsStore:
    default:
      defaultCertificate:
        secretName: fincato-pnogo-wildcard-tls
  ports:
    websecure:
      transport:
        respondingTimeouts:
          readTimeout: 600
          writeTimeout: 600
          idleTimeout: 600
      http3:
        enabled: true
        advertisedPort: 443
      http:
        middlewares:
        - traefik-crowdsec-bouncer@kubernetescrd
  experimental:
    plugins:
      crowdsec-bouncer:
        moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
        version: v1.8.1
