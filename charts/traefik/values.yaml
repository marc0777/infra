traefik:
  accessLog:
    enabled: true
  metrics:
    prometheus:
      serviceMonitor:
        enabled: true
  global:
    checkNewVersion: false
    sendAnonymousUsage: false
  additionalArguments:
  - --serverstransport.insecureskipverify=true
  tlsStore:
    default:
      defaultCertificate:
        secretName: fincato-pnogo-wildcard-tls
  ports:
    websecure:
      transport:
        respondingTimeouts:
          readTimeout: 600
          writeTimeout: 600
          idleTimeout: 600
      http:
        middlewares:
        - traefik-crowdsec-bouncer@kubernetescrd
  experimental:
    plugins:
      crowdsec-bouncer:
        moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
        version: v1.8.1
