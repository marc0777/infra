longhorn:
  preUpgradeChecker:
    jobEnabled: false
  longhornUI:
    replicas: 1
  csi:
    attacherReplicaCount: 2
    provisionerReplicaCount: 2
    resizerReplicaCount: 2
    snapshotterReplicaCount: 2
  defaultSettings:
    # % of node CPU requested per instance manager; applied only once all volumes are detached
    guaranteedInstanceManagerCPU: '{"v1":"5","v2":"5"}'
  metrics:
    serviceMonitor:
      enabled: true
      metricRelabelings:
        - action: drop
          sourceLabels: [__name__]
          regex: longhorn_(rest_client|workqueue)_.+_bucket
