apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: apiserver
spec:
  namespaceSelector:
    matchNames: [default]
  selector:
    matchLabels:
      component: apiserver
      provider: kubernetes
  endpoints:
    - port: https
      scheme: https
      tlsConfig:
        caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        serverName: kubernetes
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      metricRelabelConfigs:
        - action: keep
          source_labels: [__name__]
          regex: apiserver_(request_total|request_duration_seconds_bucket|storage_size_bytes|resource_objects|admission_webhook_rejection_count|admission_webhook_admission_duration_seconds_count|requested_deprecated_apis)
        # keep only 8 of 24 latency buckets
        - action: drop
          source_labels: [__name__, le]
          regex: apiserver_request_duration_seconds_bucket;(0.005|0.05|0.2|0.6|0.8|1.25|1.5|3|4|6|8|15|20|30|45|60)
  jobLabel: component
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: coredns
spec:
  namespaceSelector:
    matchNames: [kube-system]
  selector:
    matchLabels:
      k8s-app: kube-dns
  endpoints:
    - port: metrics
  jobLabel: k8s-app
