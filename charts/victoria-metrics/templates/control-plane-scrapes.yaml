apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: apiserver
spec:
  namespaceSelector:
    matchNames: [default]
  selector:
    matchLabels:
      component: apiserver
      provider: kubernetes
  endpoints:
    - port: https
      scheme: https
      tlsConfig:
        caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        serverName: kubernetes
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      metricRelabelConfigs:
        - action: drop
          source_labels: [__name__]
          regex: (apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_watch_events_sizes_bucket|etcd_request_duration_seconds_bucket|apiserver_request_sli_duration_seconds_bucket|apiserver_storage_list_duration_seconds_bucket|apiserver_watch_cache_.+_bucket|apiserver_watch_events_dispatch_duration_seconds_bucket|apiserver_watch_list_duration_seconds_bucket)
        # keep only 8 of 24 latency buckets
        - action: drop
          source_labels: [__name__, le]
          regex: apiserver_request_duration_seconds_bucket;(0.005|0.05|0.2|0.6|0.8|1.25|1.5|3|4|6|8|15|20|30|45|60)
  jobLabel: component
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: coredns
spec:
  namespaceSelector:
    matchNames: [kube-system]
  selector:
    matchLabels:
      k8s-app: kube-dns
  endpoints:
    - port: metrics
  jobLabel: k8s-app
