apiVersion: operator.victoriametrics.com/v1beta1
kind: VMNodeScrape
metadata:
  name: cadvisor
spec:
  path: /metrics/cadvisor
  scheme: https
  honorLabels: true
  honorTimestamps: false
  tlsConfig:
    insecureSkipVerify: true
    caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
  metricRelabelConfigs:
    - action: keep
      source_labels: [__name__]
      regex: container_(cpu_usage_seconds_total|memory_working_set_bytes|pressure_(cpu|memory|io)_stalled_seconds_total|network_(receive|transmit)_bytes_total|fs_(reads|writes)_bytes_total)
    - action: labeldrop
      regex: (uid|id|name)
  relabelConfigs:
    - action: labelmap
      regex: __meta_kubernetes_node_label_(.+)
    - sourceLabels: [__metrics_path__]
      targetLabel: metrics_path
    - targetLabel: job
      replacement: kubelet
